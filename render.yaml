# queue-agents (Pattern 2): thin web producer + background worker over a Valkey
# queue, with its own Postgres. Valkey is kept at "starter" to match the already-
# provisioned instance (Render can't downgrade a running Key Value to free). The
# database is "basic-256mb" (paid) so it doesn't collide with the one free Postgres
# per workspace that Pattern 1 already uses. Web + worker stay free.
projects:
  - name: agents-workshop-queue
    environments:
      - name: production
        databases:
          - name: queue-agents-db
            plan: basic-256mb
            region: oregon
            postgresMajorVersion: "18"
        services:
          - type: keyvalue
            name: queue-agents-valkey
            plan: starter
            region: oregon
            maxmemoryPolicy: noeviction
            ipAllowList: []
          - type: web
            name: queue-agents-web
            runtime: node
            region: oregon
            plan: free
            buildCommand: npm ci
            startCommand: npm run start --workspace @workshop/queue-agents
            healthCheckPath: /healthz
            envVars:
              - key: DATABASE_URL
                fromDatabase: { name: queue-agents-db, property: connectionString }
              - key: VALKEY_URL
                fromService: { name: queue-agents-valkey, type: keyvalue, property: connectionString }
              - key: NODE_ENV
                value: production
          - type: worker
            name: queue-agents-worker
            runtime: node
            region: oregon
            plan: free
            numInstances: 1
            buildCommand: npm ci
            startCommand: npm run start:worker --workspace @workshop/queue-agents
            envVars:
              - key: DATABASE_URL
                fromDatabase: { name: queue-agents-db, property: connectionString }
              - key: VALKEY_URL
                fromService: { name: queue-agents-valkey, type: keyvalue, property: connectionString }
              - key: NODE_ENV
                value: production
