# naive-agent (Pattern 1), patched to FREE plans for a zero-cost demo deploy.
# Builds from the repo root so the npm workspaces resolve.
projects:
  - name: agents-workshop-naive
    environments:
      - name: production
        databases:
          - name: naive-agent-db
            plan: free
            region: oregon
            postgresMajorVersion: "18"
        services:
          - type: web
            name: naive-agent
            runtime: node
            region: oregon
            plan: free
            buildCommand: npm ci
            startCommand: npm run start --workspace @workshop/naive-agent
            healthCheckPath: /healthz
            envVars:
              - key: DATABASE_URL
                fromDatabase:
                  name: naive-agent-db
                  property: connectionString
              - key: NODE_ENV
                value: production
