# queue-agents (Pattern 2): thin web producer + background worker over a Valkey
# queue. Render allows only ONE free Postgres per workspace, and Pattern 1's
# naive-agent-db already uses it — so this blueprint does NOT create a database.
# Instead, set DATABASE_URL (sync:false) on BOTH services to the naive-agent-db
# *Internal* Connection String, so the queue shares the same telemetry tables
# (reviews/findings/spans, created IF NOT EXISTS). KeyValue is free and separate.
projects:
  - name: agents-workshop-queue
    environments:
      - name: production
        services:
          - type: keyvalue
            name: queue-agents-valkey
            plan: free
            region: oregon
            maxmemoryPolicy: noeviction
            ipAllowList: []
          - type: web
            name: queue-agents-web
            runtime: node
            region: oregon
            plan: free
            buildCommand: npm ci
            startCommand: npm run start --workspace @workshop/queue-agents
            healthCheckPath: /healthz
            envVars:
              - key: DATABASE_URL
                sync: false
              - key: VALKEY_URL
                fromService: { name: queue-agents-valkey, type: keyvalue, property: connectionString }
              - key: NODE_ENV
                value: production
          - type: worker
            name: queue-agents-worker
            runtime: node
            region: oregon
            plan: free
            numInstances: 1
            buildCommand: npm ci
            startCommand: npm run start:worker --workspace @workshop/queue-agents
            envVars:
              - key: DATABASE_URL
                sync: false
              - key: VALKEY_URL
                fromService: { name: queue-agents-valkey, type: keyvalue, property: connectionString }
              - key: NODE_ENV
                value: production
